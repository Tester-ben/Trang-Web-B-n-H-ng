<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Style Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #111;
            color: #fff;
        }
        .admin-topbar {
            height: 64px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 38px;
            border-bottom: 1px solid #252525;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .admin-logo {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 6px;
        }
        .admin-topbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .admin-topbar a,
        .admin-topbar button {
            color: #fff;
            background: transparent;
            border: none;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .admin-page {
            max-width: 1120px;
            margin: 42px auto;
            padding: 0 20px 60px;
        }
        .admin-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 28px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
        }
        .admin-subtitle {
            margin: 10px 0 0;
            color: #aaa;
            font-size: 13px;
        }
        .order-count {
            padding: 9px 15px;
            border: 1px solid #444;
            border-radius: 999px;
            font-size: 12px;
            color: #ddd;
        }
        .order-card {
            background: #1f1f1f;
            padding: 24px;
            margin-bottom: 18px;
            border-radius: 14px;
            border: 1px solid #303030;
            box-shadow: 0 12px 28px rgba(0,0,0,0.22);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid #333;
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        .order-id {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 130px;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            white-space: nowrap;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-shipping { background: #dbeafe; color: #1d4ed8; }
        .status-done { background: #d4edda; color: #155724; }
        .customer-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 26px;
            font-size: 13px;
            color: #d5d5d5;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .customer-grid b { color: #fff; }
        .product-list {
            background: #171717;
            border: 1px solid #2a2a2a;
            padding: 14px;
            border-radius: 10px;
            margin-top: 12px;
        }
        .product-item {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            padding: 8px 0;
            border-bottom: 1px solid #292929;
            color: #ccc;
            font-size: 13px;
        }
        .product-item:last-child { border-bottom: none; }
        .total-price {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            text-align: right;
            margin-top: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: .5px;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.92; }
        .btn-confirm { background: #fff; color: #111; }
        .btn-complete { background: #2563eb; color: #fff; }
        .btn-delete { background: transparent; color: #fff; border-color: #555; }
        .empty-state {
            text-align: center;
            color: #888;
            border: 1px dashed #444;
            padding: 45px 20px;
            border-radius: 14px;
            background: #181818;
        }
        #login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top, #242424, #090909 60%);
        }
        .login-card {
            width: 100%;
            max-width: 390px;
            background: #1d1d1d;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 18px 48px rgba(0,0,0,.35);
        }
        .login-card h2 {
            margin: 0 0 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 20px;
            text-align: center;
        }
        .login-card p {
            margin: 0 0 24px;
            color: #aaa;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }
        .login-card input {
            width: 100%;
            padding: 14px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 9px;
            outline: none;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .login-card input:focus { border-color: #fff; }
        .login-card button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #fff;
            color: #111;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .login-error {
            min-height: 20px;
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        #admin-screen { display: none; }
        @media (max-width: 720px) {
            .admin-topbar { padding: 0 18px; }
            .admin-logo { font-size: 14px; letter-spacing: 4px; }
            .admin-title-row { flex-direction: column; align-items: flex-start; }
            .customer-grid { grid-template-columns: 1fr; }
            .order-header { align-items: flex-start; flex-direction: column; }
            .btn-group { justify-content: stretch; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

<section id="login-screen">
    <div class="login-card">
        <h2>Admin Login</h2>
        <p>Nhập mật khẩu admin để vào trang quản lý đơn hàng.</p>
        <input type="password" id="adminPassword" placeholder="Mật khẩu admin" autocomplete="current-password">
        <button onclick="loginAdmin()">Đăng nhập</button>
        <div class="login-error" id="loginError"></div>
    </div>
</section>

<section id="admin-screen">
    <header class="admin-topbar">
        <a href="index.html" class="admin-logo">THE STYLE HUB</a>
        <div class="admin-topbar-right">
            <a href="index.html">Về website</a>
            <button onclick="logoutAdmin()">Đăng xuất</button>
        </div>
    </header>

    <main class="admin-page">
        <div class="admin-title-row">
            <div>
                <h1>Quản lý đơn hàng</h1>
                <p class="admin-subtitle">Xác nhận đơn để khách thấy trạng thái chuyển từ “Đang chờ xác nhận” sang “Đang giao”.</p>
            </div>
            <div class="order-count" id="orderCount">0 đơn hàng</div>
        </div>
        <div id="admin-orders"></div>
    </main>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="stylehub-orders-api.js"></script>
<script>

    const ADMIN_PASSWORD = "admin123";

    function loginAdmin() {
        const passwordInput = document.getElementById('adminPassword');
        const errorBox = document.getElementById('loginError');
        const password = passwordInput.value.trim();

        if (password === ADMIN_PASSWORD) {
            sessionStorage.setItem('stylehub_admin_logged_in', 'true');
            errorBox.textContent = '';
            showAdminScreen();
        } else {
            errorBox.textContent = 'Sai mật khẩu admin. Vui lòng nhập lại.';
            passwordInput.value = '';
            passwordInput.focus();
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem('stylehub_admin_logged_in');
        document.getElementById('admin-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('adminPassword').value = '';
        document.getElementById('adminPassword').focus();
    }

    function showAdminScreen() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        renderOrders();
        startAdminRealtime();
    }

    document.getElementById('adminPassword').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') loginAdmin();
    });

    let adminRealtimeStarted = false;

    function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function safeParseOrders(key) {
        try {
            const data = JSON.parse(localStorage.getItem(key) || '[]');
            return Array.isArray(data) ? data : [];
        } catch (error) {
            return [];
        }
    }

    function getOrderKeys() {
        return Object.keys(localStorage).filter(function(key) {
            return key === 'hub_orders' || key.indexOf('hub_orders_') === 0;
        });
    }

    function getLocalOrdersFallback() {
        let allOrders = [];
        getOrderKeys().forEach(function(key) {
            allOrders = allOrders.concat(safeParseOrders(key));
        });
        const map = new Map();
        allOrders.forEach(function(order) {
            if (!order) return;
            const normalized = window.StyleHubOrders && StyleHubOrders.normalizeOrder ? StyleHubOrders.normalizeOrder(order) : order;
            map.set(normalized.orderId || JSON.stringify(normalized), normalized);
        });
        return Array.from(map.values()).sort(function(a, b) {
            return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0);
        });
    }

    function calculateTotal(items) {
        if (!Array.isArray(items)) return '0 ₫';
        let total = 0;
        items.forEach(function(item) {
            const priceText = String(item.price || item.priceFormatted || '0');
            const price = parseInt(priceText.replace(/[^\d]/g, ''), 10) || Number(item.priceNum) || 0;
            const quantity = Number(item.qty || item.quantity || 1);
            total += price * quantity;
        });
        return total.toLocaleString('vi-VN') + ' ₫';
    }

    function getStatusClass(status) {
        const normalizedStatus = String(status || '').toLowerCase();
        if (normalizedStatus.includes('giao')) return 'status-shipping';
        if (normalizedStatus.includes('nhận') || normalizedStatus.includes('hoàn')) return 'status-done';
        return 'status-pending';
    }

    function getCustomerInfo(order) {
        const info = order.userInfo || {};
        return {
            name: info.name || order.customerName || order.name || 'N/A',
            phone: info.phone || order.customerPhone || order.phone || 'N/A',
            email: info.email || order.userEmail || order.customerEmail || order.shippingEmail || order.email || 'N/A',
            address: info.address || order.customerAddress || order.address || 'Chưa cập nhật địa chỉ'
        };
    }

    async function getAdminOrders() {
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.getAllOrders === 'function') {
                return await StyleHubOrders.getAllOrders();
            }
        } catch (error) {
            console.error('Không lấy được đơn hàng từ cloud, chuyển sang localStorage:', error);
        }
        return getLocalOrdersFallback();
    }

    async function renderOrders(preloadedOrders) {
        const orders = Array.isArray(preloadedOrders) ? preloadedOrders : await getAdminOrders();
        const container = document.getElementById('admin-orders');
        const orderCount = document.getElementById('orderCount');
        orderCount.textContent = orders.length + ' đơn hàng';

        if (orders.length === 0) {
            container.innerHTML = '<div class="empty-state">Chưa có đơn hàng nào.</div>';
            return;
        }

        container.innerHTML = orders.map(function(rawOrder) {
            const order = window.StyleHubOrders && StyleHubOrders.normalizeOrder ? StyleHubOrders.normalizeOrder(rawOrder) : rawOrder;
            const items = Array.isArray(order.orderedProductsList) ? order.orderedProductsList : [];
            const customer = getCustomerInfo(order);
            const status = order.status || 'Đang chờ xác nhận';
            const statusClass = getStatusClass(status);
            const displayTotal = order.totalPriceFormatted || order.totalPrice || calculateTotal(items);
            const date = order.orderDate || order.date || 'N/A';
            const orderId = order.orderId || 'N/A';
            const isShipping = String(status).toLowerCase().includes('giao');
            const isDone = String(status).toLowerCase().includes('nhận') || String(status).toLowerCase().includes('hoàn');

            return `
                <article class="order-card">
                    <div class="order-header">
                        <strong class="order-id">Mã đơn: ${escapeHtml(orderId)}</strong>
                        <span class="status-badge ${statusClass}">${escapeHtml(status)}</span>
                    </div>

                    <div class="customer-grid">
                        <div>🕒 <b>Thời gian đặt:</b> ${escapeHtml(date)}</div>
                        <div>👤 <b>Khách hàng:</b> ${escapeHtml(customer.name)}</div>
                        <div>📞 <b>Số điện thoại:</b> ${escapeHtml(customer.phone)}</div>
                        <div>✉️ <b>Email:</b> ${escapeHtml(customer.email)}</div>
                        <div style="grid-column: 1 / -1;">🏠 <b>Địa chỉ:</b> ${escapeHtml(customer.address)}</div>
                    </div>

                    <div class="product-list">
                        ${items.length ? items.map(function(item) {
                            return `
                                <div class="product-item">
                                    <span>• ${escapeHtml(item.name || 'Sản phẩm')} (Size: ${escapeHtml(item.size || '-')}) x ${escapeHtml(item.qty || item.quantity || 1)}</span>
                                    <span>${escapeHtml(item.price || '')}</span>
                                </div>
                            `;
                        }).join('') : '<div class="product-item"><span>Không có dữ liệu sản phẩm</span><span></span></div>'}
                    </div>

                    <div class="total-price">TỔNG CỘNG: ${escapeHtml(displayTotal)}</div>
                    <div class="btn-group">
                        ${(!isShipping && !isDone) ? `<button class="btn btn-confirm" onclick="confirmOrder('${escapeHtml(orderId)}')">Xác nhận đơn hàng</button>` : ''}
                        ${(!isDone) ? `<button class="btn btn-complete" onclick="completeOrder('${escapeHtml(orderId)}')">Đã giao xong</button>` : ''}
                        <button class="btn btn-delete" onclick="removeOrder('${escapeHtml(orderId)}')">Xóa đơn</button>
                    </div>
                </article>
            `;
        }).join('');
    }

    function startAdminRealtime() {
        if (adminRealtimeStarted) return;
        adminRealtimeStarted = true;
        if (window.StyleHubOrders && typeof StyleHubOrders.onOrdersChanged === 'function') {
            StyleHubOrders.onOrdersChanged(function(orders) {
                renderOrders(orders);
            });
        } else {
            window.addEventListener('storage', function(event) {
                if (event.key && event.key.indexOf('hub_orders') === 0) renderOrders();
            });
        }
    }

    async function confirmOrder(orderId) {
        if (!orderId || orderId === 'N/A') return;
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.updateOrderStatus === 'function') {
                await StyleHubOrders.updateOrderStatus(orderId, 'Đang giao');
            }
            await renderOrders();
            alert('Đã xác nhận đơn hàng. Bên tài khoản khách sẽ hiện trạng thái: Đang giao.');
        } catch (error) {
            alert('Không cập nhật được trạng thái đơn. Kiểm tra Firebase/config hoặc mạng internet.');
            console.error(error);
        }
    }

    async function completeOrder(orderId) {
        if (!orderId || orderId === 'N/A') return;
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.updateOrderStatus === 'function') {
                await StyleHubOrders.updateOrderStatus(orderId, 'Đã nhận hàng');
            }
            await renderOrders();
        } catch (error) {
            alert('Không cập nhật được trạng thái đơn.');
            console.error(error);
        }
    }

    async function removeOrder(orderId) {
        if (!orderId || orderId === 'N/A') return;
        if (!confirm('Bạn có chắc chắn muốn xóa đơn hàng này không?')) return;
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.deleteOrder === 'function') {
                await StyleHubOrders.deleteOrder(orderId);
            }
            await renderOrders();
        } catch (error) {
            alert('Không xóa được đơn.');
            console.error(error);
        }
    }

    if (sessionStorage.getItem('stylehub_admin_logged_in') === 'true') {
        showAdminScreen();
    } else {
        document.getElementById('adminPassword').focus();
    }
</script>
</body>
</html>
