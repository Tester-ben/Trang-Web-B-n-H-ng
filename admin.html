<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Style Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg-main: #08111f;
            --bg-soft: #0c1728;
            --card: rgba(20, 28, 42, 0.88);
            --card-2: rgba(12, 19, 32, 0.95);
            --border: rgba(148, 163, 184, 0.18);
            --text: #f8fafc;
            --muted: #aab5c5;
            --accent: #60a5fa;
            --accent-2: #22c55e;
            --danger: #fb7185;
        }
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 0%, rgba(37, 99, 235, 0.28), transparent 32%),
                radial-gradient(circle at 85% 12%, rgba(14, 165, 233, 0.16), transparent 30%),
                linear-gradient(135deg, #05070d 0%, #08111f 45%, #0f172a 100%);
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 44px 44px;
            opacity: .14;
        }
        .admin-topbar {
            height: 68px;
            background: rgba(3, 7, 18, 0.82);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 38px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 16px 40px rgba(0,0,0,.22);
        }
        .admin-logo {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 6px;
        }
        .admin-topbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .admin-topbar a,
        .admin-topbar button {
            color: #e5edf8;
            background: transparent;
            border: none;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: .2s;
        }
        .admin-topbar a:hover,
        .admin-topbar button:hover { color: #93c5fd; }
        .admin-page {
            max-width: 1120px;
            margin: 46px auto;
            padding: 0 20px 70px;
            position: relative;
            z-index: 1;
        }
        .admin-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 28px;
        }
        h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 0 10px 30px rgba(96,165,250,.15);
        }
        .admin-subtitle {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }
        .order-count {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 12px;
            color: #dbeafe;
            background: rgba(15, 23, 42, .65);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
        }
        .order-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, .94), rgba(15, 23, 42, .86));
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 22px 55px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,.04);
            position: relative;
            overflow: hidden;
        }
        .order-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(96, 165, 250, .85), rgba(34, 197, 94, .55), transparent);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        .order-id {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
            white-space: nowrap;
            box-shadow: 0 10px 26px rgba(0,0,0,.18);
        }
        .status-pending { background: #fef3c7; color: #7c4a03; }
        .status-shipping { background: #dbeafe; color: #1d4ed8; }
        .status-done { background: #dcfce7; color: #166534; }
        .customer-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 26px;
            font-size: 13px;
            color: #d7deea;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .customer-grid b { color: #fff; }
        .product-list {
            background: rgba(3, 7, 18, .46);
            border: 1px solid rgba(148, 163, 184, 0.14);
            padding: 14px;
            border-radius: 13px;
            margin-top: 12px;
        }
        .product-item {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            color: #d1d5db;
            font-size: 13px;
        }
        .product-item:last-child { border-bottom: none; }
        .total-price {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-align: right;
            margin-top: 17px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            letter-spacing: .45px;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.94; }
        .btn-confirm { background: linear-gradient(135deg, #22c55e, #86efac); color: #052e16; border-color: rgba(134,239,172,.75); box-shadow: 0 12px 26px rgba(34,197,94,.18); }
        .btn-complete { background: linear-gradient(135deg, #2563eb, #60a5fa); color: #fff; }
        .btn-disabled { background: rgba(148,163,184,.12); color: #8fa0b7; border-color: rgba(148,163,184,.16); cursor: not-allowed; }
        .btn-delete { background: rgba(15, 23, 42, .35); color: #fff; border-color: rgba(248, 113, 113, .45); }
        .btn-delete:hover { color: #fecaca; border-color: #fb7185; }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            border: 1px dashed rgba(148, 163, 184, 0.35);
            padding: 45px 20px;
            border-radius: 18px;
            background: rgba(15, 23, 42, .66);
        }
        #login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, rgba(37, 99, 235, 0.34), transparent 36%),
                linear-gradient(135deg, #030712, #0f172a);
        }
        .login-card {
            width: 100%;
            max-width: 390px;
            background: rgba(15, 23, 42, .9);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 34px;
            box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
        }
        .login-card h2 {
            margin: 0 0 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 20px;
            text-align: center;
        }
        .login-card p {
            margin: 0 0 24px;
            color: #aab5c5;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }
        .login-card input {
            width: 100%;
            padding: 14px;
            background: rgba(3, 7, 18, .76);
            color: #fff;
            border: 1px solid rgba(148, 163, 184, 0.26);
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .login-card input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,.12); }
        .login-card button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #e0f2fe, #93c5fd);
            color: #0f172a;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .login-error {
            min-height: 20px;
            color: #fb7185;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        #admin-screen { display: none; }
        .admin-toast-wrap {
            position: fixed;
            top: 86px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        .admin-toast {
            min-width: 280px;
            max-width: 390px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 17px;
            border-radius: 16px;
            color: #f8fafc;
            background: rgba(15, 23, 42, .94);
            border: 1px solid rgba(134, 239, 172, .32);
            box-shadow: 0 22px 55px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.06);
            backdrop-filter: blur(16px);
            animation: toastIn .22s ease-out;
        }
        .toast-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #22c55e, #86efac);
            color: #052e16;
            font-weight: 900;
            flex: 0 0 auto;
        }
        .toast-title { font-weight: 900; letter-spacing: .2px; }
        .toast-note { color: #aab5c5; font-size: 12px; margin-top: 2px; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-8px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (max-width: 720px) {
            .admin-topbar { padding: 0 18px; }
            .admin-logo { font-size: 14px; letter-spacing: 4px; }
            .admin-title-row { flex-direction: column; align-items: flex-start; }
            .customer-grid { grid-template-columns: 1fr; }
            .order-header { align-items: flex-start; flex-direction: column; }
            .btn-group { justify-content: stretch; }
            .btn { width: 100%; }
            .admin-toast-wrap { top: 76px; left: 16px; right: 16px; }
            .admin-toast { min-width: 0; max-width: none; }
        }
    </style>
</head>
<body>
<div class="admin-toast-wrap" id="adminToastWrap"></div>

<section id="login-screen">
    <div class="login-card">
        <h2>Admin Login</h2>
        <p>Nhập mật khẩu admin để vào trang quản lý đơn hàng.</p>
        <input type="password" id="adminPassword" placeholder="Mật khẩu admin" autocomplete="current-password">
        <button onclick="loginAdmin()">Đăng nhập</button>
        <div class="login-error" id="loginError"></div>
    </div>
</section>

<section id="admin-screen">
    <header class="admin-topbar">
        <a href="index.html" class="admin-logo">THE STYLE HUB</a>
        <div class="admin-topbar-right">
            <a href="index.html">Về website</a>
            <button onclick="logoutAdmin()">Đăng xuất</button>
        </div>
    </header>

    <main class="admin-page">
        <div class="admin-title-row">
            <div>
                <h1>Quản lý đơn hàng</h1>
                <p class="admin-subtitle">Quản lý đơn hàng, xác nhận trạng thái giao hàng và xóa các đơn test/không hợp lệ.</p>
            </div>
            <div class="order-count" id="orderCount">0 đơn hàng</div>
        </div>
        <div id="admin-orders"></div>
    </main>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="stylehub-orders-api.js"></script>
<script>

    const ADMIN_PASSWORD = "admin123";

    function loginAdmin() {
        const passwordInput = document.getElementById('adminPassword');
        const errorBox = document.getElementById('loginError');
        const password = passwordInput.value.trim();

        if (password === ADMIN_PASSWORD) {
            sessionStorage.setItem('stylehub_admin_logged_in', 'true');
            errorBox.textContent = '';
            showAdminScreen();
        } else {
            errorBox.textContent = 'Sai mật khẩu admin. Vui lòng nhập lại.';
            passwordInput.value = '';
            passwordInput.focus();
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem('stylehub_admin_logged_in');
        document.getElementById('admin-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('adminPassword').value = '';
        document.getElementById('adminPassword').focus();
    }

    function showAdminScreen() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        renderOrders();
        startAdminRealtime();
    }

    document.getElementById('adminPassword').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') loginAdmin();
    });

    let adminRealtimeStarted = false;

    function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function safeParseOrders(key) {
        try {
            const data = JSON.parse(localStorage.getItem(key) || '[]');
            return Array.isArray(data) ? data : [];
        } catch (error) {
            return [];
        }
    }

    function getOrderKeys() {
        return Object.keys(localStorage).filter(function(key) {
            return key === 'hub_orders' || key.indexOf('hub_orders_') === 0;
        });
    }

    function getLocalOrdersFallback() {
        let allOrders = [];
        getOrderKeys().forEach(function(key) {
            allOrders = allOrders.concat(safeParseOrders(key));
        });
        const map = new Map();
        allOrders.forEach(function(order) {
            if (!order) return;
            const normalized = window.StyleHubOrders && StyleHubOrders.normalizeOrder ? StyleHubOrders.normalizeOrder(order) : order;
            map.set(normalized.orderId || JSON.stringify(normalized), normalized);
        });
        return Array.from(map.values()).sort(function(a, b) {
            return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0);
        });
    }

    function calculateTotal(items) {
        if (!Array.isArray(items)) return '0 ₫';
        let total = 0;
        items.forEach(function(item) {
            const priceText = String(item.price || item.priceFormatted || '0');
            const price = parseInt(priceText.replace(/[^\d]/g, ''), 10) || Number(item.priceNum) || 0;
            const quantity = Number(item.qty || item.quantity || 1);
            total += price * quantity;
        });
        return total.toLocaleString('vi-VN') + ' ₫';
    }

    function normalizeStatusText(status) {
        return String(status || '').trim().toLowerCase();
    }

    function isPendingStatus(status) {
        const normalizedStatus = normalizeStatusText(status);
        return normalizedStatus.includes('chờ') || normalizedStatus.includes('xác nhận') || normalizedStatus === '';
    }

    function isShippingStatus(status) {
        const normalizedStatus = normalizeStatusText(status);
        return normalizedStatus === 'đang giao' || normalizedStatus.includes('đang giao');
    }

    function isDoneStatus(status) {
        const normalizedStatus = normalizeStatusText(status);
        return normalizedStatus.includes('đã nhận') || normalizedStatus.includes('đã giao xong') || normalizedStatus.includes('hoàn thành');
    }

    function getStatusClass(status) {
        if (isShippingStatus(status)) return 'status-shipping';
        if (isDoneStatus(status)) return 'status-done';
        return 'status-pending';
    }

    function getCustomerInfo(order) {
        const info = order.userInfo || {};
        return {
            name: info.name || order.customerName || order.name || 'N/A',
            phone: info.phone || order.customerPhone || order.phone || 'N/A',
            email: info.email || order.userEmail || order.customerEmail || order.shippingEmail || order.email || 'N/A',
            address: info.address || order.customerAddress || order.address || 'Chưa cập nhật địa chỉ'
        };
    }

    async function getAdminOrders() {
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.getAllOrders === 'function') {
                return await StyleHubOrders.getAllOrders();
            }
        } catch (error) {
            console.error('Không lấy được đơn hàng từ cloud, chuyển sang localStorage:', error);
        }
        return getLocalOrdersFallback();
    }

    async function renderOrders(preloadedOrders) {
        const orders = Array.isArray(preloadedOrders) ? preloadedOrders : await getAdminOrders();
        const container = document.getElementById('admin-orders');
        const orderCount = document.getElementById('orderCount');
        orderCount.textContent = orders.length + ' đơn hàng';

        if (orders.length === 0) {
            container.innerHTML = '<div class="empty-state">Chưa có đơn hàng nào.</div>';
            return;
        }

        container.innerHTML = orders.map(function(rawOrder) {
            const order = window.StyleHubOrders && StyleHubOrders.normalizeOrder ? StyleHubOrders.normalizeOrder(rawOrder) : rawOrder;
            const items = Array.isArray(order.orderedProductsList) ? order.orderedProductsList : [];
            const customer = getCustomerInfo(order);
            const status = order.status || 'Đang chờ xác nhận';
            const statusClass = getStatusClass(status);
            const displayTotal = order.totalPriceFormatted || order.totalPrice || calculateTotal(items);
            const date = order.orderDate || order.date || 'N/A';
            const orderId = order.orderId || 'N/A';
            const isShipping = isShippingStatus(status);
            const isDone = isDoneStatus(status);
            const isPending = isPendingStatus(status);

            return `
                <article class="order-card">
                    <div class="order-header">
                        <strong class="order-id">Mã đơn: ${escapeHtml(orderId)}</strong>
                        <span class="status-badge ${statusClass}">${escapeHtml(status)}</span>
                    </div>

                    <div class="customer-grid">
                        <div>🕒 <b>Thời gian đặt:</b> ${escapeHtml(date)}</div>
                        <div>👤 <b>Khách hàng:</b> ${escapeHtml(customer.name)}</div>
                        <div>📞 <b>Số điện thoại:</b> ${escapeHtml(customer.phone)}</div>
                        <div>✉️ <b>Email:</b> ${escapeHtml(customer.email)}</div>
                        <div style="grid-column: 1 / -1;">🏠 <b>Địa chỉ:</b> ${escapeHtml(customer.address)}</div>
                    </div>

                    <div class="product-list">
                        ${items.length ? items.map(function(item) {
                            return `
                                <div class="product-item">
                                    <span>• ${escapeHtml(item.name || 'Sản phẩm')} (Size: ${escapeHtml(item.size || '-')}) x ${escapeHtml(item.qty || item.quantity || 1)}</span>
                                    <span>${escapeHtml(item.price || '')}</span>
                                </div>
                            `;
                        }).join('') : '<div class="product-item"><span>Không có dữ liệu sản phẩm</span><span></span></div>'}
                    </div>

                    <div class="total-price">TỔNG CỘNG: ${escapeHtml(displayTotal)}</div>
                    <div class="btn-group">
                        ${isPending ? `<button class="btn btn-confirm" onclick="confirmOrder('${escapeHtml(orderId)}')">Chấp nhận đơn hàng</button>` : `<button class="btn btn-disabled" disabled>${isShipping ? 'Đang giao' : 'Đã xử lý'}</button>`}
                        <button class="btn btn-delete" onclick="removeOrder('${escapeHtml(orderId)}')">Xóa đơn</button>
                    </div>
                </article>
            `;
        }).join('');
    }

    function startAdminRealtime() {
        if (adminRealtimeStarted) return;
        adminRealtimeStarted = true;
        if (window.StyleHubOrders && typeof StyleHubOrders.onOrdersChanged === 'function') {
            StyleHubOrders.onOrdersChanged(function(orders) {
                renderOrders(orders);
            });
        } else {
            window.addEventListener('storage', function(event) {
                if (event.key && event.key.indexOf('hub_orders') === 0) renderOrders();
            });
        }
    }

    function showAdminToast(title, note) {
        const wrap = document.getElementById('adminToastWrap');
        if (!wrap) return;
        const toast = document.createElement('div');
        toast.className = 'admin-toast';
        toast.innerHTML = `
            <span class="toast-icon">✓</span>
            <span>
                <span class="toast-title">${escapeHtml(title)}</span>
                ${note ? `<span class="toast-note">${escapeHtml(note)}</span>` : ''}
            </span>
        `;
        wrap.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-8px) scale(.98)';
            toast.style.transition = '.22s';
            setTimeout(function() { toast.remove(); }, 240);
        }, 2200);
    }

    async function confirmOrder(orderId) {
        if (!orderId || orderId === 'N/A') return;
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.updateOrderStatus === 'function') {
                await StyleHubOrders.updateOrderStatus(orderId, 'Đang giao');
            }
            await renderOrders();
            showAdminToast('Đã chấp nhận đơn hàng');
        } catch (error) {
            showAdminToast('Không cập nhật được đơn hàng', 'Kiểm tra Firebase/config hoặc mạng internet.');
            console.error(error);
        }
    }

    async function completeOrder(orderId) {
        if (!orderId || orderId === 'N/A') return;
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.updateOrderStatus === 'function') {
                await StyleHubOrders.updateOrderStatus(orderId, 'Đã nhận hàng');
            }
            await renderOrders();
        } catch (error) {
            showAdminToast('Không cập nhật được trạng thái đơn');
            console.error(error);
        }
    }

    async function removeOrder(orderId) {
        if (!orderId || orderId === 'N/A') return;
        if (!confirm('Bạn có chắc chắn muốn xóa đơn hàng này không?')) return;
        try {
            if (window.StyleHubOrders && typeof StyleHubOrders.deleteOrder === 'function') {
                await StyleHubOrders.deleteOrder(orderId);
            }
            await renderOrders();
        } catch (error) {
            showAdminToast('Không xóa được đơn');
            console.error(error);
        }
    }

    if (sessionStorage.getItem('stylehub_admin_logged_in') === 'true') {
        showAdminScreen();
    } else {
        document.getElementById('adminPassword').focus();
    }
</script>
</body>
</html>
